name: FIELDNOTES V3.9 three-step and region maps
on:
  pull_request:
    paths:
      - 'preview/v39/**'
      - 'docs/V39_THREE_STEP.md'
      - '.github/workflows/fieldnotes-v39-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check P1 JavaScript syntax
        run: |
          node --check preview/v39/offline-pack-manager-v38.js
          node --check preview/v39/v38-map-core.js
          node --check preview/v39/p1-art-direction.js
          node --check preview/v39/tools/test_p0_real_map_buildings.cjs
          node --check preview/v39/vendor/pmtiles.js
          node --check preview/v39/national-map-source.js
          node --check preview/v39/national-map-provider.js
          node --check preview/v39/tools/test_national_pmtiles_browser.cjs
          node --check preview/v39/sw.js
          for file in preview/v39/packs/*.js; do node --check "$file"; done
      - name: Regenerate map packs and compare tracked results
        run: |
          node preview/v39/tools/split_offline_packs.cjs
          git diff --exit-code -- preview/v39/packs/
      - name: Run offline cache management tests
        run: node preview/v39/tools/test_managed_packs.cjs
      - name: Browser smoke test (real headless Chromium, without third-party install scripts)
        run: |
          npm install --no-save --ignore-scripts --prefix preview/v39/tools playwright@1.56.1
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ] && [ ! -x /usr/bin/chromium-browser ]; then
            preview/v39/tools/node_modules/.bin/playwright install chromium
          fi
          node preview/v39/tools/test_managed_packs_browser.cjs
      - name: Install Chinese fonts for meaningful screenshot review
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Real Chromium V3.9 location prompt and 6+6 gallery
        run: node preview/v39/tools/test_v39_three_step_browser.cjs
      - name: P0 bundled building geometry and real Z13 offline coverage
        run: node preview/v39/tools/test_p0_real_map_buildings.cjs
      - name: Create temporary real Hangzhou Z14 PMTiles fixture (no public upload)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pmtiles==3.8.1
          python3 preview/v39/tools/build_national_qa_fixture.py
      - name: Browser acceptance for nationwide on-demand PMTiles cache
        run: node preview/v39/tools/test_national_pmtiles_browser.cjs
      - name: Delete temporary PMTiles test archive
        if: always()
        run: rm -rf preview/v39/tools/.national-qa
      - name: Save real Chromium screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-v39-rendered-mobile-screenshots
          path: preview/v39/tools/test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build isolated domestic static bundle
        run: python3 preview/v39/tools/build_domestic_static.py
      - name: Assert deploy ZIP preserves opt-in maps and excludes obsolete monolith
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          z=Path("preview/v39/downloads/FIELDNOTES_V3.9_Managed_Maps_Static_Deploy.zip")
          with ZipFile(z) as pkg:
              names=set(pkg.namelist())
              required={"index.html","sw.js","offline-pack-manager-v38.js",
                  "packs/469028.js","packs/310101.js","packs/610113.js"}
              assert required<=names
              assert "offline-tiles-v38.js" not in names
              assert pkg.testzip() is None
          print("PASS: deploy ZIP has independently removable packs")
          PY
      - name: Publish verification ZIP as a short-lived CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-v39-managed-maps-static
          path: preview/v39/downloads/FIELDNOTES_V3.9_Managed_Maps_Static_Deploy.zip
          retention-days: 7
      - name: Prepare no-domain ModelScope Static and HTTP Range probe bundle
        run: python3 preview/v39/tools/prepare_modelscope_static_trial.py
      - name: Upload ModelScope deployment trial ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fieldnotes-v39-modelscope-static-trial
          path: preview/v39/downloads/FIELDNOTES_V39_MODELSCOPE_STATIC_TRIAL.zip
          retention-days: 7
